{{ define "deeplink_error.html" }}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Title }}</title>
<link rel="stylesheet" href="{{ .ChromeCSS }}">
<link rel="stylesheet" href="{{ .StaticBase }}/vault.css">
</head>
<body>
{{ template "chrome_header" .Header }}
<main class="deeplink-error">
<h1>This Reveal link can't be used</h1>
<p class="deeplink-reason">{{ .ReasonMessage }}</p>
<p>You can:</p>
<ul>
  <li>Ask Kit in Slack for a fresh Reveal link.</li>
  <li>Or <a href="/{{ .TenantSlug }}/apps/vault">open the vault directly</a> and find the entry yourself.</li>
</ul>
</main>
</body>
</html>
{{ end }}
