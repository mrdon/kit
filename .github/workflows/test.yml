name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kit
          POSTGRES_PASSWORD: kit
          POSTGRES_DB: kit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://kit:kit@localhost:5432/kit?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Exact patch, matching the Makefile's GOTOOLCHAIN pin. '1.25'
          # floats to the newest 1.25.x, which can drift away from what
          # contributors run locally and from what golangci-lint v2.8.0
          # can decode.
          go-version: '1.25.1'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontends (required by //go:embed)
        run: |
          cd web
          npm ci
          npm run build --workspaces --if-present

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted. Run 'go fmt ./...' to fix:"
            gofmt -d .
            exit 1
          fi

      - name: Lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.8.0
          golangci-lint run

      - name: Test
        run: |
          go mod tidy
          go vet ./...
          go test -v -race -cover ./...

      - name: Build
        run: make build

  # Deploys main to Dokku once the tests pass. The SSH key lives in the
  # "production" environment, which only main may use, so a workflow on a
  # PR branch can't read it. Dokku's /health startup check (app.json) keeps
  # the old container serving if the new one fails to boot.
  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    # One deploy at a time, in order; never cancel one mid-build.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Dokku refuses pushes from a shallow clone.
          fetch-depth: 0

      - name: Push to Dokku
        env:
          DOKKU_SSH_KEY: ${{ secrets.DOKKU_SSH_KEY }}
          DOKKU_KNOWN_HOSTS: ${{ vars.DOKKU_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DOKKU_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DOKKU_KNOWN_HOSTS" > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git push dokku@apps.twdata.org:kit "$GITHUB_SHA:refs/heads/main"
